[package]
name = "arquimetria-portal"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.7.9"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "net", "fs", "sync", "signal"] }
tokio-postgres = { version = "0.7.18", features = ["with-serde_json-1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"

[profile.dev]
debug = 1
